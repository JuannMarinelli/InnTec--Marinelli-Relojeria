<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VÉRITÉ HORLOGERIE - LogIn</title>
    <link rel="icon" type="image/png" href="./fotos/verite_logo_solo.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="contenedor-login">
        <form class="formulario" action="index.html">
            <a href="index.html">
                <img class="logo-login" src="./fotos/verite_logo_nombre.png" alt="Logo de Vérité Horlogerie">
            </a>
            <h2>Iniciar sesión</h2>

            <input class="campo" type="email" placeholder="Email" required>
            <input class="campo" type="password" placeholder="Contraseña" minlength="8" maxlength="20" required>

            <button class="boton boton-login" type="submit">Ingresar</button>

            <a class="enlace" href="index.html">Volver al inicio</a>
        </form>
    </main>
</body>
</html>
